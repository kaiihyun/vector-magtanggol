<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Vector Magtanggol</title>
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f1f4ff;
        --glow: #ffa84a;
        --line: #4a7fb8;
        --plum: #b9a6ff;
        --rose: #ff9db5;
        --mint: #9ff0d0;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "VT323", monospace;
        font-size: 23px;
        color: var(--ink);
        background: #050b24;
        overflow-x: hidden;
        min-height: 100vh;
      }
      #bg {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 0;
        image-rendering: pixelated;
      }
      main {
        position: relative;
        z-index: 1;
        max-width: 780px;
        margin: 0 auto;
        padding: 18px 14px 40px;
      }
      .hid {
        display: none !important;
      }
      h1,
      h2,
      .pf {
        font-family: "Press Start 2P", monospace;
      }
      .panel {
        background: rgba(7, 18, 52, 0.84);
        border: 4px solid var(--line);
        box-shadow:
          inset 0 0 0 3px #0b1a42,
          0 0 24px rgba(255, 150, 60, 0.22);
        padding: 18px;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        color: #06142e;
        background: var(--glow);
        border: 3px solid #ffe0b0;
        box-shadow: 0 4px 0 #b4561a;
        padding: 8px 16px;
        cursor: pointer;
        margin: 4px 6px 8px 0;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #b4561a;
      }
      .btn.alt {
        background: #1a3380;
        color: var(--ink);
        border-color: var(--line);
        box-shadow: 0 4px 0 #0a1a4d;
      }
      .btn.no {
        background: var(--rose);
        color: #3a0f1f;
        box-shadow: 0 4px 0 #b05a74;
      }
      #intro {
        text-align: center;
        padding-top: 7vh;
      }
      #intro h1 {
        font-size: clamp(20px, 5.4vw, 36px);
        color: #fff;
        text-shadow:
          0 0 14px #ffb454,
          0 0 30px #ff7a1a,
          4px 4px 0 #5a2410;
        margin: 0 0 10px;
        line-height: 1.5;
      }
      #intro .sub {
        color: #ffe3bd;
        text-shadow: 0 0 8px #ff8a2a;
        margin-bottom: 34px;
      }
      .dlg {
        border: 4px solid #ffcf8a;
        background: rgba(12, 20, 56, 0.74);
        color: #fff;
        text-shadow: 0 0 8px rgba(255, 170, 80, 0.7);
        text-align: left;
        padding: 18px 20px;
        max-width: 560px;
        margin: 0 auto;
        font-size: 26px;
        box-shadow: 0 0 24px rgba(255, 150, 60, 0.35);
      }
      .dlg .opts {
        margin-top: 14px;
      }
      .dlg button {
        font: inherit;
        background: none;
        border: 0;
        color: #e9f6ff;
        text-shadow: inherit;
        cursor: pointer;
        padding: 4px 18px 4px 0;
        opacity: 0.7;
      }
      .dlg button:hover,
      .dlg button.on {
        opacity: 1;
      }
      .dlg button:hover::before,
      .dlg button.on::before {
        content: "▸ ";
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: -4px;
        position: relative;
        z-index: 2;
        padding-left: 8px;
      }
      .tabs button {
        font: inherit;
        font-weight: 600;
        letter-spacing: 1px;
        padding: 10px 16px 8px;
        border: 4px solid var(--line);
        border-bottom: 0;
        background: #c8651c;
        color: #fff;
        cursor: pointer;
        text-shadow: 0 0 6px #ffb454;
      }
      .tabs button.p {
        background: #3c2f8f;
      }
      .tabs button.off {
        background: #0b1a42;
        opacity: 0.8;
      }
      .hello {
        background: rgba(20, 32, 80, 0.6);
        border: 3px dashed #d8892f;
        padding: 12px 14px;
        margin-bottom: 16px;
      }
      .hello b {
        display: block;
        font-family: "Press Start 2P", monospace;
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 6px;
        color: var(--glow);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 560px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        text-align: left;
        font: inherit;
        color: var(--ink);
        background: rgba(16, 36, 92, 0.92);
        border: 3px solid var(--line);
        border-left: 12px solid var(--glow);
        padding: 10px 12px;
        cursor: pointer;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4);
      }
      .card:hover {
        background: rgba(40, 46, 100, 0.97);
        box-shadow:
          0 4px 0 rgba(0, 0, 0, 0.4),
          0 0 14px rgba(255, 170, 70, 0.55);
      }
      .card:active {
        transform: translateY(3px);
      }
      .card strong {
        display: block;
        font-size: 26px;
      }
      .card span {
        font-size: 21px;
        opacity: 0.85;
      }
      .card .ic {
        float: right;
        font-size: 26px;
        margin-left: 8px;
        color: var(--glow);
      }
      .card:nth-child(even) {
        border-left-color: #6fb4ff;
      }
      .card.rnd {
        border-left-color: var(--plum);
      }
      .card.hrd {
        border-left-color: var(--rose);
      }
      .card.qd {
        border-left-color: var(--mint);
      }
      .stat {
        display: flex;
        justify-content: space-between;
        border-bottom: 2px dotted var(--line);
        padding: 8px 2px;
      }
      #sheet {
        position: relative;
        background: #f6ecd0
          repeating-linear-gradient(
            transparent 0 35px,
            rgba(90, 130, 190, 0.3) 35px 36px
          );
        color: #3a2a1c;
        padding: 30px 24px 22px 60px;
        min-height: 300px;
        border: 4px solid #2a4a9a;
        box-shadow:
          0 0 26px rgba(255, 150, 60, 0.3),
          0 8px 0 rgba(0, 0, 0, 0.4);
      }
      #sheet::before {
        content: "";
        position: absolute;
        left: 42px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(210, 80, 80, 0.55);
      }
      #sheet::after {
        content: "";
        position: absolute;
        left: 10px;
        top: 18px;
        bottom: 18px;
        width: 12px;
        background: radial-gradient(circle, #0a1230 5px, transparent 6px) 0
          0/12px 40px;
      }
      #sheet .btn.alt {
        background: #e3d3a6;
        color: #3a2a1c;
        border-color: #a9805a;
        box-shadow: 0 4px 0 #a9805a;
      }
      .tag {
        display: inline-block;
        background: #ffc989;
        border: 3px solid #c8751f;
        padding: 2px 10px;
        font-size: 20px;
        margin: 0 8px 12px 0;
      }
      .tag.hard {
        background: #cdbfff;
        border-color: #8b74b0;
      }
      .q {
        font-size: 27px;
        line-height: 1.5;
        margin: 6px 0 18px;
      }
      .sol {
        background: rgba(255, 255, 255, 0.55);
        border: 3px dashed #a9805a;
        padding: 12px 16px;
        margin: 10px 0 14px;
      }
      .sol ol {
        margin: 6px 0 10px;
        padding-left: 26px;
        line-height: 1.4;
        font-size: 25px;
      }
      .ans {
        background: #bfe9cf;
        border: 3px solid #3f9c7c;
        padding: 8px 12px;
        font-size: 26px;
      }
      .ans.bad {
        background: #f3b3a5;
        border-color: #b8745f;
      }
      canvas.gr {
        display: block;
        margin: 12px auto 2px;
        max-width: 100%;
        border: 3px dashed #a9805a;
        background: rgba(255, 252, 236, 0.8);
        cursor: grab;
      }
      .hint {
        text-align: center;
        font-size: 18px;
        opacity: 0.7;
        margin-bottom: 8px;
      }
      .busy {
        font-size: 20px;
        padding: 70px 0;
        text-align: center;
      }
      #cur {
        position: fixed;
        left: 0;
        top: 0;
        width: 90px;
        height: 90px;
        margin: -45px 0 0 -45px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 99;
        background: radial-gradient(
          circle,
          rgba(255, 238, 200, 0.95) 0,
          rgba(255, 172, 62, 0.65) 8%,
          rgba(255, 120, 30, 0.28) 30%,
          transparent 68%
        );
        mix-blend-mode: screen;
        opacity: 0;
        transition: opacity 0.2s;
        animation: fl 1.6s ease-in-out infinite;
      }
      @keyframes fl {
        50% {
          filter: brightness(1.25);
        }
      }
      @media (pointer: fine) {
        * {
          cursor: none !important;
        }
      }
      @media (pointer: coarse) {
        #cur {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="cur"></div>
    <main>
      <section id="intro">
        <h1>VECTOR<br />MAGTANGGOL</h1>
        <div class="sub">calculus 2 midterm war</div>
        <div class="dlg">
          <div id="dt">anyeong haseyo. ready na ba? ishor jd</div>
          <div class="opts">
            <button id="y" class="on">yesp plsss</button
            ><button id="n">Not yet</button>
          </div>
        </div>
      </section>

      <section id="hub" class="hid">
        <div class="tabs">
          <button id="t1">QUEST</button
          ><button id="t2" class="p off">STATUS</button>
        </div>
        <div class="panel">
          <div class="hello"><b id="hb"></b><span id="hs"></span></div>
          <div id="quests"><div class="grid" id="grid"></div></div>
          <div id="status" class="hid"></div>
        </div>
      </section>

      <section id="quiz" class="hid">
        <button class="btn alt" id="back">◂ Back to map</button>
        <div id="sheet"></div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a,
        P = (a) => a[R(0, a.length - 1)];
      const nz = (m = 6) => {
        let v = 0;
        while (!v) v = R(-m, m);
        return v;
      };
      const V = (m = 6) => [R(-m, m), R(-m, m), R(-m, m)],
        NV = (m = 6) => [nz(m), nz(m), nz(m)];
      const N = (n) => (n < 0 ? "−" + -n : "" + n);
      const f = (v) =>
        `⟨${v.map((x) => (typeof x === "number" ? N(x) : x)).join(", ")}⟩`;
      const pt = (v) =>
        `(${v.map((x) => (typeof x === "number" ? N(x) : x)).join(", ")})`;
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const cr = (a, b) => [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
      const sub = (a, b) => a.map((x, i) => x - b[i]),
        add = (a, b) => a.map((x, i) => x + b[i]),
        sc = (k, a) => a.map((x) => k * x);
      const mag = (v) => dot(v, v),
        zero = (v) => !v[0] && !v[1] && !v[2];
      const gcd = (a, b) => {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b) {
          [a, b] = [b, a % b];
        }
        return a;
      };
      const lcm = (a, b) => (a / gcd(a, b)) * b;
      const fr = (n, d = 1) => {
        if (d < 0) {
          n = -n;
          d = -d;
        }
        const g = gcd(n, d) || 1;
        return [n / g, d / g];
      };
      const fs = ([n, d]) =>
        d === 1 ? N(n) : (n < 0 ? "−" : "") + Math.abs(n) + "/" + d;
      const fadd = (a, b) => fr(a[0] * b[1] + b[0] * a[1], a[1] * b[1]),
        fsub = (a, b) => fadd(a, [-b[0], b[1]]);
      const cfs = (c, s) => {
        const [n, d] = c;
        if (!n) return "0";
        const a = Math.abs(n);
        const body = d === 1 ? (a === 1 && s ? "" : a) : `(${a}/${d})`;
        return (n < 0 ? "−" : "") + body + s;
      };
      const rad = (n) => {
        let a = 1,
          b = n;
        for (let i = Math.floor(Math.sqrt(n)); i > 1; i--) {
          if (n % (i * i) === 0) {
            a = i;
            b = n / (i * i);
            break;
          }
        }
        return [a, b];
      };
      const sq = (n) => {
          const [a, b] = rad(n);
          return b === 1 ? `${a}` : `${a === 1 ? "" : a}√${b}`;
        },
        ap = (n) => Math.sqrt(n).toFixed(2);
      const sqp = (n) => {
        const s = sq(n);
        return /^\d+$|^√\d+$/.test(s) ? s : `(${s})`;
      };
      const deg = (r) => ((r * 180) / Math.PI).toFixed(1) + "°";
      const tm = (arr, lead) => {
        let o = "";
        arr.forEach(([c, s]) => {
          if (!c) return;
          const a = Math.abs(c),
            n = a === 1 && s ? "" : a;
          const first = !o && !lead;
          o += (first ? (c < 0 ? "−" : "") : c < 0 ? " − " : " + ") + n + s;
        });
        return o;
      };
      const sh = (v, c) =>
        c === 0 ? v : `${v} ${c < 0 ? "+" : "−"} ${Math.abs(c)}`;
      const plane = (n, d) =>
        `${tm([
          [n[0], "x"],
          [n[1], "y"],
          [n[2], "z"],
        ])} = ${N(d)}`;
      const NM = ["x", "y", "z"];
      const pnForm = (n, p) => {
        let o = "";
        [0, 1, 2].forEach((i) => {
          const c = n[i];
          if (!c) return;
          const body = `${Math.abs(c) === 1 ? "" : Math.abs(c)}(${sh(NM[i], p[i])})`;
          o += (o ? (c < 0 ? " − " : " + ") : c < 0 ? "−" : "") + body;
        });
        return o;
      };
      const pc = (p, d, t = "t") => {
        const term = d === 0 ? "" : (Math.abs(d) === 1 ? "" : Math.abs(d)) + t;
        if (!term) return N(p);
        if (!p) return (d < 0 ? "−" : "") + term;
        return N(p) + (d < 0 ? " − " : " + ") + term;
      };
      const parEq = (p, d, t = "t") =>
        [0, 1, 2].map((i) => `${NM[i]} = ${pc(p[i], d[i], t)}`).join(", ");
      const wrap = (v, c) => (c === 0 ? v : `(${sh(v, c)})`);
      const symEq = (p, d) => {
        const a = [],
          b = [];
        [0, 1, 2].forEach((i) =>
          d[i] === 0
            ? b.push(`${NM[i]} = ${N(p[i])}`)
            : a.push(`${wrap(NM[i], p[i])}/${N(d[i])}`),
        );
        return a.join(" = ") + b.map((x) => ", " + x).join("");
      };
      const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶" };
      const pw = (n) => (n === 1 ? "t" : n === 0 ? "1" : `t${SUP[n]}`);
      const expn = (k) => (k === 1 ? "e^t" : `e^(${N(k)}t)`);
      const kt = (k) => (k === 1 ? "t" : `${N(k)}t`);
      const pF = (v, dv, u = "u") => {
        const vs = v[0] ? fs(v) : "";
        if (!dv[0]) return vs || "0";
        const a = [Math.abs(dv[0]), dv[1]];
        const co =
          a[0] === 1 && a[1] === 1 ? "" : a[1] === 1 ? a[0] : `(${fs(a)})`;
        const term = co + u;
        if (!vs) return (dv[0] < 0 ? "−" : "") + term;
        return vs + (dv[0] < 0 ? " − " : " + ") + term;
      };
      const pickn = (arr, n, ...args) =>
        [...arr]
          .sort(() => Math.random() - 0.5)
          .slice(0, n)
          .map((g) => g(...args));
      const shuf = (a) => [...a].sort(() => Math.random() - 0.5);

      const G = {};
      /* ---------- VECTORS & OPERATIONS ---------- */
      G.vec = () => {
        let a, b, k, m, s;
        do {
          a = V();
          b = NV();
          k = nz(4);
          m = nz(4);
          s = add(sc(k, a), sc(m, b));
        } while (zero(s));
        return {
          q: `Let A = ${f(a)} and B = ${f(b)}. Compute ${tm([
            [k, "A"],
            [m, "B"],
          ])} and find its magnitude.`,
          steps: [
            `${k}A = ${f(sc(k, a))} and ${m}B = ${f(sc(m, b))}.`,
            `Add: ${f(s)}.`,
            `Magnitude: √(${s.map((x) => x * x).join(" + ")}) = √${mag(s)}.`,
          ],
          ans: `${f(s)}; magnitude ${sq(mag(s))} ≈ ${ap(mag(s))}`,
        };
      };
      G.unit = () => {
        let p, q, d;
        do {
          p = V();
          q = V();
          d = sub(q, p);
        } while (zero(d));
        const m = mag(d);
        return {
          q: `Find the unit vector in the direction of PQ, where P${pt(p)} and Q${pt(q)}.`,
          steps: [
            `PQ = Q − P = ${f(d)}.`,
            `|PQ| = √(${d.map((x) => x * x).join(" + ")}) = √${m}.`,
            `Unit vector = PQ / |PQ|.`,
          ],
          ans: `${f(d)} / ${sq(m)} ≈ ${f(d.map((x) => (x / Math.sqrt(m)).toFixed(3)))}`,
        };
      };
      G.proj = () => {
        const A = NV(4),
          B = NV(4),
          d = dot(A, B),
          m = mag(A);
        return {
          q: `Let A = ${f(A)} and B = ${f(B)}. Find the vector projection of B onto A.`,
          steps: [
            `A · B = ${d} and |A|² = ${m}.`,
            `proj_A B = (A · B / |A|²) A = (${d}/${m}) ${f(A)}.`,
          ],
          ans: `proj_A B = ${f(A.map((x) => fs(fr(d * x, m))))}`,
        };
      };
      G.decomp = () => {
        const A = NV(4),
          B = NV(4),
          d = dot(A, B),
          m = mag(A);
        return {
          q: `Let A = ${f(A)} and B = ${f(B)}. Write B as the sum of a vector parallel to A and a vector orthogonal to A.`,
          steps: [
            `Parallel part: proj_A B = (A · B / |A|²) A = (${d}/${m}) A.`,
            `Orthogonal part: B − proj_A B.`,
            `Check that the orthogonal part has dot product 0 with A.`,
          ],
          ans: `B = ${f(A.map((x) => fs(fr(d * x, m))))} + ${f(B.map((x, i) => fs(fr(x * m - d * A[i], m))))}`,
        };
      };
      G.area = () => {
        let p, q, r, n;
        do {
          p = V();
          q = V();
          r = V();
          n = cr(sub(q, p), sub(r, p));
        } while (zero(n));
        const m = mag(n);
        return {
          q: `Find the area of the triangle with vertices P${pt(p)}, Q${pt(q)} and R${pt(r)}.`,
          steps: [
            `PQ = ${f(sub(q, p))}, PR = ${f(sub(r, p))}.`,
            `PQ × PR = ${f(n)}.`,
            `Area = ½|PQ × PR| = ½√${m}.`,
          ],
          ans: `Area = ½·${sq(m)} ≈ ${(Math.sqrt(m) / 2).toFixed(2)} square units`,
        };
      };
      G.para4 = () => {
        let A, B, C, n;
        do {
          A = V();
          B = V();
          C = V();
          n = cr(sub(B, A), sub(C, B));
        } while (zero(n));
        const D = sub(add(A, C), B),
          m = mag(n);
        return {
          q: `A, B, C are consecutive vertices of the parallelogram ABCD, with A${pt(A)}, B${pt(B)}, C${pt(C)}. Find the fourth vertex D and the area of the parallelogram.`,
          steps: [
            `In a parallelogram AD = BC, so D = A + (C − B) = ${pt(D)}.`,
            `AB = ${f(sub(B, A))}, BC = ${f(sub(C, B))}, AB × BC = ${f(n)}.`,
            `Area = |AB × BC| = √${m}.`,
          ],
          ans: `D = ${pt(D)}; area = ${sq(m)} ≈ ${ap(m)}`,
        };
      };
      G.orth = () => {
        let a, b, n;
        do {
          a = V();
          b = V();
          n = cr(a, b);
        } while (zero(n));
        const m = mag(n);
        return {
          q: `Find a unit vector orthogonal to both A = ${f(a)} and B = ${f(b)}.`,
          steps: [
            `A × B is orthogonal to both: A × B = ${f(n)}.`,
            `|A × B| = √${m}.`,
            `Divide by the magnitude (either sign works).`,
          ],
          ans: `±${f(n)} / ${sq(m)}`,
        };
      };
      G.missK = () => {
        const pos = R(0, 2),
          b = NV(4),
          a = V(5);
        let s = 0;

      /* ---------- QUADRIC GRAPHS ---------- */
      const TAU = Math.PI * 2,
        pl = (n, f) => Array.from({ length: n + 1 }, (_, i) => f(i / n)),
        UU = (n, lo, hi) =>
          Array.from({ length: n }, (_, i) => lo + ((hi - lo) * i) / (n - 1));
      const rings = (us, f) => us.map((u) => pl(48, (t) => f(u, t * TAU))),
        mer = (ths, f, lo, hi) =>
          ths.map((th) => pl(24, (t) => f(lo + (hi - lo) * t, th)));
      function lines(g) {
        const { t, a, b, c } = g,
          C = Math.cos,
          S = Math.sin,
          TH = UU(12, 0, (TAU * 11) / 12);
        if (t === "sph" || t === "ell") {
          const A = t === "sph" ? 1 : a,
            B = t === "sph" ? 1 : b,
            D = t === "sph" ? 1 : c,
            f = (p, q) => [A * S(p) * C(q), B * S(p) * S(q), D * C(p)];
          return [
            ...rings(UU(7, 0.35, Math.PI - 0.35), f),
            ...mer(TH, f, 0, Math.PI),
          ];
        }
        if (t === "h1") {
          const f = (u, q) => [
            a * Math.sqrt(1 + u * u) * C(q),
            b * Math.sqrt(1 + u * u) * S(q),
            c * u,
          ];
          return [...rings(UU(7, -1.2, 1.2), f), ...mer(TH, f, -1.2, 1.2)];
        }
        if (t === "h2") {
          let o = [];
          [1, -1].forEach((s) => {
            const f = (u, q) => [
              a * u * C(q),
              b * u * S(q),
              s * c * Math.sqrt(1 + u * u),
            ];
            o.push(...rings(UU(5, 0.25, 1.2), f), ...mer(TH, f, 0, 1.2));
          });
          return o;
        }
        if (t === "ep") {
          const f = (u, q) => [a * u * C(q), b * u * S(q), u * u];
          return [...rings(UU(5, 0.25, 1.25), f), ...mer(TH, f, 0, 1.25)];
        }
        if (t === "hp") {
          const o = [];
          UU(9, -1, 1).forEach((s) => {
            o.push(
              pl(30, (u) => {
                const q = -1 + 2 * u;
                return [a * s, b * q, q * q - s * s];
              }),
            );
            o.push(
              pl(30, (u) => {
                const q = -1 + 2 * u;
                return [a * q, b * s, s * s - q * q];
              }),
            );
          });
          return o;
        }
        if (t === "cone") {
          const f = (u, q) => [a * u * C(q), b * u * S(q), c * u];
          return [...rings(UU(6, -1, 1), f), ...mer(TH, f, -1, 1)];
        }
        const H = Math.max(a, b) * 0.9;
        if (t === "ec") {
          const f = (z, q) => [a * C(q), b * S(q), z * H];
          return [...rings(UU(5, -1, 1), f), ...mer(TH, f, -1, 1)];
        }
        const o = [];
        [1, -1].forEach((s) => {
          const f = (u, z) => [s * a * Math.cosh(u), b * Math.sinh(u), z * H];
          UU(9, -1.2, 1.2).forEach((u) =>
            o.push(pl(2, (z) => f(u, -1 + 2 * z))),
          );
          UU(5, -1, 1).forEach((z) =>
            o.push(pl(30, (k) => f(-1.2 + 2.4 * k, z))),
          );
        });
        return o;
      }
      const GR = (n, a, b, c, eq = "") => {
        n = n.toLowerCase();
        let t, p;
        if (n === "sphere") t = "sph";
        else if (n.includes("elliptic parab")) t = "ep";
        else if (n.includes("hyperbolic parab")) {
          t = "hp";
          if (/^z =/.test(eq)) p = [1, 0, 2];
        } else if (n.includes("elliptic cone")) t = "cone";
        else if (n.includes("elliptic cyl")) t = "ec";
        else if (n.includes("hyperbolic cyl")) {
          t = "hc";
          if (eq.includes("z²")) p = [0, 2, 1];
        } else if (n.includes("ellipsoid")) t = "ell";
        else if (n.includes("one sheet")) t = "h1";
        else {
          t = "h2";
          if (/^x²/.test(eq) && eq.includes("− y²")) p = [2, 0, 1];
        }
        return { t, a, b, c, p };
      };
      function drawG(cv, g) {
        if (!cv) return;
        const w = Math.min(320, (cv.parentNode.clientWidth || 320) - 10),
          h = Math.round(w * 0.82),
          d = devicePixelRatio || 1;
        cv.width = w * d;
        cv.height = h * d;
        cv.style.width = w + "px";
        cv.style.height = h + "px";
        const x = cv.getContext("2d");
        const p = g.p || [0, 1, 2],
          Ls = lines(g).map((l) => l.map((q) => [q[p[0]], q[p[1]], q[p[2]]]));
        let m = 0.01;
        Ls.forEach((l) =>
          l.forEach((q) => q.forEach((z) => (m = Math.max(m, Math.abs(z))))),
        );
        const s = (h * 0.36) / m,
          v = cv._v || (cv._v = { az: 0.7, el: 0.5 });
        const dr = () => {
          x.setTransform(d, 0, 0, d, 0, 0);
          x.clearRect(0, 0, w, h);
          const ca = Math.cos(v.az),
            sa = Math.sin(v.az),
            ce = Math.cos(v.el),
            se = Math.sin(v.el),
            pr = (q) => [
              w / 2 + (q[0] * ca - q[1] * sa) * s,
              h / 2 + 4 - (q[2] * ce + (q[0] * sa + q[1] * ca) * se) * s,
            ];
          const ln = (l, c, lw) => {
            x.beginPath();
            l.forEach((q, i) => {
              const r = pr(q);
              i ? x.lineTo(r[0], r[1]) : x.moveTo(r[0], r[1]);
            });
            x.strokeStyle = c;
            x.lineWidth = lw;
            x.stroke();
          };
          [
            [1, 0, 0, "x"],
            [0, 1, 0, "y"],
            [0, 0, 1, "z"],
          ].forEach(([i, j, k, n]) => {
            const e = [i * m * 1.25, j * m * 1.25, k * m * 1.25],
              r = pr(e);
            ln([[0, 0, 0], e], "#b0452f", 1.2);
            x.fillStyle = "#b0452f";
            x.font = "16px VT323,monospace";
            x.fillText(n, r[0] + 4, r[1] - 3);
          });
          Ls.forEach((l) => ln(l, "rgba(58,42,28,.85)", 1.1));
        };
        dr();
        let dn = null;
        cv.style.touchAction = "none";
        cv.onpointerdown = (e) => {
          dn = [e.clientX, e.clientY];
          cv.setPointerCapture(e.pointerId);
        };
        cv.onpointerup = () => (dn = null);
        cv.onpointermove = (e) => {
          if (!dn) return;
          v.az += (e.clientX - dn[0]) * 0.01;
          v.el = Math.max(
            -0.2,
            Math.min(1.4, v.el + (e.clientY - dn[1]) * 0.01),
          );
          dn = [e.clientX, e.clientY];
          dr();
        };
      }
      const QD = [
        {
          n: "Sphere",
          t: "sph",
          e: (A, B, C, a) => `x² + y² + z² = ${a * a}`,
          w: (a) =>
            `Equal coefficients on x², y², z² with a positive constant: a sphere of radius ${a}. Volume = (4/3)πr³ = ${fs(fr(4 * a ** 3, 3))}π.`,
        },
        {
          n: "Ellipsoid",
          t: "ell",
          e: (A, B, C) => `x²/${A} + y²/${B} + z²/${C} = 1`,
          w: (a, b, c) =>
            `All three squares are positive and the right side is 1: an ellipsoid with semi-axes ${a}, ${b}, ${c}. Volume = (4/3)πabc = ${fs(fr(4 * a * b * c, 3))}π.`,
        },
        {
          n: "Elliptic Cylinder",
          t: "ec",
          e: (A, B) => `x²/${A} + y²/${B} = 1`,
          w: () =>
            `z is missing, so the rulings are parallel to the z-axis. The cross-section is an ellipse.`,
        },
        {
          n: "Hyperbolic Cylinder",
          t: "hc",
          e: (A, B) => `x²/${A} − y²/${B} = 1`,
          w: () =>
            `z is missing, so the rulings are parallel to the z-axis. The cross-section is a hyperbola (two separate pieces).`,
        },
        {
          n: "Elliptic Paraboloid",
          t: "ep",
          e: (A, B) => `z = x²/${A} + y²/${B}`,
          w: () =>
            `z to the first power and two squares with the same sign: horizontal slices are ellipses, vertical slices are parabolas. It opens upward.`,
        },
        {
          n: "Elliptic Cone",
          t: "cone",
          e: (A, B, C) => `x²/${A} + y²/${B} − z²/${C} = 0`,
          w: () =>
            `The right side is 0 and the signs are mixed: a cone with its vertex at the origin.`,
        },
        {
          n: "Hyperboloid of One Sheet",
          t: "h1",
          e: (A, B, C) => `x²/${A} + y²/${B} − z²/${C} = 1`,
          w: () =>
            `One minus sign and +1 on the right: one connected sheet, with the z-axis as the axis.`,
        },
        {
          n: "Hyperboloid of Two Sheets",
          t: "h2",
          e: (A, B, C) => `x²/${A} + y²/${B} − z²/${C} = −1`,
          w: () =>
            `Two plus signs and −1 on the right (equivalently z²/c² − x²/a² − y²/b² = 1): two separate sheets along the z-axis.`,
        },
        {
          n: "Hyperbolic Paraboloid",
          t: "hp",
          e: (A, B) => `z = y²/${B} − x²/${A}`,
          w: () =>
            `z to the first power and two squares with opposite signs: a saddle surface.`,
        },
      ];
      G.qid = () => {
        const d = P(QD);
        let a = R(2, 4),
          b,
          c = R(2, 4);
        do {
          b = R(2, 5);
        } while (b === a);
        if (d.t === "ell" && c === a) c = a + 1;
        const eq = d.e(a * a, b * b, c * c, a),
          gr = { t: d.t, a, b, c },
          why = d.w(a, b, c);
        if (Math.random() < 0.5)
          return {
            q: `Identify (name) the surface ${eq}.`,
            steps: [
              why,
              `Compare with the standard forms in your notebook, then check the graph below.`,
            ],
            ans: d.n,
            gr,
          };
        return {
          q: `Look at the graph below. Name this quadric surface and write a standard form for it.`,
          qg: gr,
          steps: [
            `Look at the slices: ${why}`,
            `Match the shape with its standard equation.`,
          ],
          ans: `${d.n}: ${eq}`,
          gr,
        };
      };
      /* ---------- NIGHT SCENE ---------- */
      const cv = $("bg"),
        cx = cv.getContext("2d");
      let W,
        H,
        Z,
        st,
        ss,
        bk,
        tt = 0;
      function fit() {
        Z = innerWidth < 600 ? 4 : 5;
        W = Math.ceil(innerWidth / Z);
        H = Math.ceil(innerHeight / Z);
        cv.width = W;
        cv.height = H;
        cv.style.width = W * Z + "px";
        cv.style.height = H * Z + "px";
        st = [...Array(Math.ceil((W * H) / 320))].map(() => ({
          x: R(0, W - 1),
          y: R(0, (H * 0.62) | 0),
          p: Math.random() * 6,
          b: R(0, 2),
        }));
        ss = [
          { x: 0, y: 0, l: -R(10, 60) },
          { x: 0, y: 0, l: -R(80, 200) },
        ];
        bk = [...Array(6)].map(() => ({
          x: R(0, W),
          y: R(3, (H * 0.4) | 0),
          w: R(5, 12),
          h: R(3, 6),
          v: 0.03 + Math.random() * 0.05,
        }));
      }
      const px = (x, y, w = 1, h = 1, c) => {
        if (c) cx.fillStyle = c;
        cx.fillRect(x | 0, y | 0, Math.ceil(w), Math.ceil(h));
      };
      const spr = (rows, x, y, c) =>
        rows.forEach((r, j) =>
          [...r].forEach((ch, i) => ch === "#" && px(x + i, y + j, 1, 1, c)),
        );
      const CAT = [
        ".#....#.",
        ".##..##.",
        ".######.",
        ".######.",
        "..####..",
        ".######.",
        ".######.",
        ".######.",
      ];
      const DINO = [
        "......####.",
        ".....######",
        ".....#.####",
        ".....######",
        ".....###...",
        "#...####...",
        "##.#####..#",
        "########..#",
        ".######....",
        "..####.....",
        "..#..#.....",
      ];
      function draw() {
        tt++;
        const t = tt,
          hz = (H * 0.64) | 0;
        [
          "#03071a",
          "#050d28",
          "#08143a",
          "#0b1c4a",
          "#1a2860",
          "#3a3866",
        ].forEach((c, i) => px(0, (hz * i) / 6, W, hz / 6 + 1, c));
        for (let x = 0; x < W; x += 2) {
          const a =
              0.5 +
              0.5 * Math.sin(x / 14 + t / 70) * Math.sin(x / 37 - t / 110),
            h = H * 0.3 * a;
          px(x, H * 0.05, 2, h, `rgba(70,200,255,${0.025 + 0.055 * a})`);
          px(x, H * 0.05, 2, h * 0.5, `rgba(120,255,220,${0.015 + 0.03 * a})`);
        }
        st.forEach((s) => {
          const a = 0.25 + 0.5 * Math.abs(Math.sin(t / 35 + s.p));
          px(s.x, s.y, 1, 1, `rgba(235,245,255,${a})`);
          if (s.b === 0 && a > 0.9) {
            px(s.x - 1, s.y, 3, 1);
            px(s.x, s.y - 1, 1, 3);
          }
        });
        bk.forEach((b) => {
          b.x += b.v;
          if (b.x > W + 14) b.x = -14;
          px(b.x, b.y, b.w, b.h, "rgba(6,14,44,.75)");
          px(b.x, b.y, b.w, 1, "rgba(90,150,220,.25)");
        });
        px(0, 0, W, hz, "rgba(2,5,18,.3)");
        const mx = Math.max(14, (W * 0.14) | 0),
          my = Math.max(14, (H * 0.1) | 0);
        for (let y = -9; y <= 9; y++)
          for (let x = -9; x <= 9; x++)
            if (
              x * x + y * y <= 64 &&
              (x - 4) * (x - 4) + (y + 2) * (y + 2) > 56
            )
              px(mx + x, my + y, 1, 1, "#cdeeff");
        ss.forEach((s) => {
          if (s.l < 0) {
            s.l++;
            if (!s.l) {
              s.x = R((W * 0.4) | 0, W);
              s.y = R(2, (H * 0.25) | 0);
              s.l = 1;
            }
            return;
          }
          s.l++;
          s.x -= 1.8;
          s.y += 0.8;
          for (let i = 0; i < 9; i++)
            px(
              s.x + i * 1.8,
              s.y - i * 0.8,
              1,
              1,
              `rgba(220,245,255,${1 - i / 9})`,
            );
          if (s.l > 45) s.l = -R(60, 220);
        });
        for (let x = 0; x < W; x++) {
          const h = 7 + Math.sin(x / 9) * 3 + Math.sin(x / 23 + 1) * 5;
          px(x, hz - h, 1, h + 1, "#091238");
        }
        for (let i = 0; i < 6; i++) {
          const fy = hz - 16 + i * 4,
            off = Math.sin(t / 200 + i) * 8;
          for (let x = -24; x < W; x += 24)
            px(
              x + off + i * 7,
              fy + Math.sin(x / 9 + i) * 1.5,
              24,
              5,
              "rgba(150,160,210,.06)",
            );
        }
        [0.05, 0.09, 0.13, 0.17].forEach((f) =>
          px(W * f, hz - 1, 1, 1, "#ffd77a"),
        );
        ["#0c2158", "#0a1c4c", "#08163c", "#061230"].forEach((c, i) =>
          px(0, hz + ((H - hz) * i) / 4, W, (H - hz) / 4 + 1, c),
        );
        for (let i = 0; i < 30; i++) {
          const x = (i * 53 + (t >> 3) * (1 + (i % 3))) % W,
            y = hz + 3 + ((i * 29) % (H - hz - 4));
          px(x, y, 3 + (i % 4), 1, "rgba(150,220,255,.35)");
        }
        for (let k = 0; k < 8; k++)
          px(
            mx - 3 + (k % 2) * 2 + Math.sin(t / 20 + k),
            hz + 3 + k * 3,
            5 - (k % 3),
            1,
            "rgba(205,238,255,.5)",
          );
        const gx = (W * 0.34) | 0,
          gy = (H * 0.86) | 0;
        px(0, gy, gx, H - gy, "#08102c");
        px(0, gy, gx, 1, "#14307a");
        spr(DINO, 2, gy - 11, "#8a94a8");
        spr([".#.", "###", ".#.", ".#.", ".#."], gx - 6, gy - 5, "#6f7a90");
        const fx = (gx * 0.55) | 0;
        for (let k = 1; k <= 5; k++)
          px(fx - 6 - k * 2, gy - k, 13 + k * 4, 1, "rgba(255,150,50,.08)");
        for (let i = 0; i < 5; i++) {
          const h = 2 + (((t >> 2) + i * 3) % 4);
          px(fx + i - 2, gy - h, 1, h, i % 2 ? "#ffb02e" : "#ff7a1a");
        }
        px(fx - 1, gy - 2, 3, 2, "#ffe27a");
        const dx = (W * 0.6) | 0,
          dy = (H * 0.8) | 0;
        px(dx, dy, W - dx, 3, "#2b3a66");
        for (let x = dx; x < W; x += 5) px(x, dy, 1, 3, "#18244a");
        px(dx + 2, dy + 3, 3, H - dy - 3, "#1b2750");
        px(W - 9, dy + 3, 3, H - dy - 3, "#1b2750");
        const cxp = dx + (((W - dx) * 0.18) | 0),
          sw = (t >> 4) & 1;
        spr(CAT, cxp, dy - 8, "#070c1e");
        px(cxp - 1, dy - 1 - sw, 1, 2, "#070c1e");
        spr(CAT, cxp + 10, dy - 8, "#e9f6ff");
        px(cxp + 18, dy - 1 - sw, 1, 2, "#e9f6ff");
        const gl = 0.5 + 0.3 * Math.sin(t / 25);
        px(W - 14, dy - 12, 15, 13, `rgba(255,160,60,${0.12 * gl})`);
        px(W - 11, dy - 9, 9, 9, `rgba(255,170,70,${0.2 * gl})`);
        px(W - 8, dy - 5, 3, 5, "#ffc46a");
        px(W - 9, dy - 6, 5, 1, "#233868");
        px(W - 9, dy, 5, 1, "#233868");
      }
      let last = 0;
      function loop(ts) {
        if (ts - last > 33) {
          last = ts;
          draw();
        }
        requestAnimationFrame(loop);
      }
      fit();
      addEventListener("resize", fit);
      requestAnimationFrame(loop);
      const cu = $("cur");
      addEventListener("pointermove", (e) => {
        cu.style.opacity = 1;
        cu.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
      });
      document.addEventListener("pointerleave", () => (cu.style.opacity = 0));
    </script>
  </body>
</html>
