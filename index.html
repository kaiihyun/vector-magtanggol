<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vector Magtanggol</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas><div id="cur"></div>
<main>
<section id="intro">
 <h1>VECTOR<br>MAGTANGGOL</h1>
 <div class="sub">a quiet study adventure</div>
 <div class="dlg"><div id="dt">Hello, traveler. Ready to study for your exam?</div>
  <div class="opts"><button id="y" class="on">Yes please</button><button id="n">Not yet</button></div></div>
</section>

<section id="hub" class="hid">
 <div class="tabs"><button id="t1">QUEST</button><button id="t2" class="p off">STATUS</button></div>
 <div class="panel">
  <div class="hello"><b id="hb"></b><span id="hs"></span></div>
  <div id="quests"><div class="grid" id="grid"></div></div>
  <div id="status" class="hid"></div>
 </div>
</section>

<section id="quiz" class="hid">
 <button class="btn alt" id="back">◂ Back to map</button>
 <div id="sheet"></div>
</section>
</main>


  <script src="script.js"></script>
</body></html>
